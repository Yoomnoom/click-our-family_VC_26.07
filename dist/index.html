<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#ef6558" />
  <title>찰칵! 우리 가족</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@500;700;900&display=swap');
    :root{--ink:#362b2b;--red:#ef6558;--yellow:#ffd76c;--cream:#fff9ea;--green:#73a887;--blue:#6d94c6}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#221c1d;font-family:'Noto Sans KR',sans-serif;color:var(--ink)}
    button{font:inherit;color:inherit}
    #app{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#584342,#241d1e 72%)}
    .game-shell{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);min-height:320px;overflow:hidden;background:var(--cream);box-shadow:0 22px 80px #0009;isolation:isolate}
    .screen{position:absolute;inset:0;display:none}.screen.active{display:flex}
    /* ===== 타이틀 ===== */
    .title-screen{align-items:center;justify-content:center;background:#f9ebc7;overflow:hidden}
    .title-screen:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#d7726250 1.5px,transparent 1.5px);background-size:22px 22px;opacity:.55}
    .album{position:relative;width:min(72%,900px);height:78%;background:#cf5e50;border-radius:18px 42px 42px 18px;box-shadow:18px 20px 0 #8f3f39,0 32px 70px #6a372f66;transform:rotate(-2deg);display:flex;align-items:center;justify-content:center;border:6px solid #e77b68}
    .album:before{content:"";position:absolute;left:26px;top:0;bottom:0;width:12px;background:repeating-linear-gradient(#6f2e2b 0 16px,#f0a18f 16px 28px);opacity:.8}
    .cover-card{width:74%;height:74%;background:#fff7df;border:11px solid #f8d28a;box-shadow:0 0 0 4px #963d36;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3%;transform:rotate(1.5deg)}
    .camera-mark{font-size:clamp(38px,6vh,80px);filter:drop-shadow(4px 5px 0 #e6b851)}
    h1{font-family:'Gaegu',cursive;font-size:clamp(42px,8vh,104px);line-height:.9;margin:.05em 0;color:#d84d44;letter-spacing:-.06em;text-shadow:4px 5px 0 #ffd974}h1 span{display:block;white-space:nowrap}
    .subtitle{font-size:clamp(12px,2vh,24px);font-weight:900;letter-spacing:.02em;margin:12px 0 18px;word-break:keep-all}
    .start-btn,.next-btn{border:0;border-radius:999px;background:var(--red);color:white;font-weight:900;font-size:clamp(15px,2.3vh,26px);padding:.7em 2em;box-shadow:0 7px 0 #a93d37;cursor:pointer;transition:.15s transform}.start-btn:active,.next-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #a93d37}
    .difficulty{display:flex;gap:7px;margin:0 0 16px;justify-content:center}.difficulty button{border:2px solid #d5aa59;background:#fff5cd;border-radius:14px;padding:7px 10px;font-weight:900;font-size:clamp(10px,1.5vh,15px);cursor:pointer;box-shadow:0 3px 0 #bf8d3e}.difficulty button.selected{background:#493735;color:#fff;border-color:#493735;transform:translateY(2px);box-shadow:0 1px 0 #2d2221}.difficulty button small{display:block;font-size:.68em;font-weight:700;opacity:.8;margin-top:2px}
    .title-sub{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}.title-sub button,.title-sub span{border:2px solid #d5aa59;background:#fff5cd;border-radius:999px;padding:5px 12px;font-weight:900;font-size:clamp(10px,1.5vh,14px);cursor:pointer}.title-sub span.locked{opacity:.55;border-style:dashed;cursor:default;background:#efe3bd}
    .how{position:absolute;bottom:3%;font-size:clamp(10px,1.45vh,17px);font-weight:700;color:#744f49;word-break:keep-all}
    /* 홈: 그림(제목·버튼 포함) 위에 같은 자리의 진짜 버튼을 겹친다. 좌표는 이미지 대비 % */
    .hero{position:relative;width:min(100%,177.78vh);aspect-ratio:16/9;container-type:size;z-index:1}
    .hero picture,.hero img{position:absolute;inset:0;width:100%;height:100%;display:block}
    .hero button{position:absolute;margin:0;cursor:pointer;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:0}
    .hero .difficulty{display:contents}
    .hero .difficulty button{top:56%;height:9.9%;width:9%;border:.18cqw solid #d5aa59;border-radius:1.3cqw;background:#fff1c8;box-shadow:0 .25cqw 0 #bf8d3e;font-size:1.5cqw;transform:none}
    .hero .difficulty button small{font-size:.8cqw;font-weight:700;color:#6b5648;margin-top:.3cqw}
    .hero .difficulty button[data-difficulty=easy]{left:62.6%}.hero .difficulty button[data-difficulty=normal]{left:72.5%;width:7.8%}.hero .difficulty button[data-difficulty=chaos]{left:81.2%}
    .hero .difficulty button.selected{background:#493735;color:#fff;border-color:#493735;box-shadow:0 .1cqw 0 #2d2221}.hero .difficulty button.selected small{color:#e9ddd4}
    .hero .start-btn{left:64.9%;top:67.7%;width:22.8%;height:8.6%;border-radius:999px;font-size:2.1cqw;padding:0;box-shadow:0 .45cqw 0 #a93d37}.hero .start-btn:active{transform:translateY(.3cqw);box-shadow:0 .12cqw 0 #a93d37}
    .hero #titleAlbum{left:69.9%;top:78.1%;width:12.7%;height:5.3%;border:.18cqw solid #c9a24f;border-radius:999px;background:#fff8e6;font-size:1.4cqw}
    @media(max-aspect-ratio:1.25/1){
      .hero{width:min(100%,56.25vh);aspect-ratio:9/16}
      .hero .difficulty button{top:77.3%;height:6.9%;width:22.6%;font-size:3.5cqw;border-radius:2.6cqw}
      .hero .difficulty button small{font-size:2.3cqw;margin-top:.5cqw}
      .hero .difficulty button[data-difficulty=easy]{left:13.8%}.hero .difficulty button[data-difficulty=normal]{left:38.8%;width:22.6%}.hero .difficulty button[data-difficulty=chaos]{left:63.4%}
      .hero .start-btn{left:19.1%;top:85.5%;width:61.8%;height:6%;font-size:5cqw;box-shadow:0 1cqw 0 #a93d37}
      .hero #titleAlbum{left:31.3%;top:92.8%;width:37.3%;height:4.2%;font-size:3.6cqw}
    }
    /* ===== 게임 ===== */
    .game-screen{flex-direction:column;background:#f3e6cb}
    .hud{height:12%;min-height:48px;background:#fff8e9;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 3%;border-bottom:4px solid #c98663;z-index:20;box-shadow:0 4px 0 #5d413a25}
    .hud-left{display:flex;align-items:center;gap:4px;font-size:clamp(12px,1.9vh,21px);font-weight:900}
    .best-label{font-size:clamp(12px,1.9vh,21px);font-weight:900;text-align:right}.best-label b{font-size:1.35em;color:#d85047}
    .gallery-btn{border:0;background:#ffe18a;border-radius:999px;padding:5px 12px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #c29a42}
    .level-badge{display:inline-block;background:#493735;color:#fff;border-radius:999px;padding:4px 9px;margin-right:3px;font-size:.75em;white-space:nowrap}
    .timer{position:relative;width:clamp(62px,9vh,100px);aspect-ratio:1;border-radius:50%;background:#fff;border:6px solid var(--red);display:grid;place-items:center;font-size:clamp(23px,4vh,45px);font-weight:900;box-shadow:0 4px 0 #b4443e;transform:translateY(8%)}
    .timer.danger{animation:pulse .45s infinite alternate;background:#fff0a8}@keyframes pulse{to{transform:translateY(8%) scale(1.08)}}
    .stage{isolation:isolate;position:relative;flex:1;overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;background:url('assets/poses/living-room2.png') center/cover no-repeat}
    /* 인물 컨테이너: 509×556 캔버스 비율 고정. 모든 포즈가 같은 캔버스를 쓰므로 크기 보정 CSS 불필요 */
    .family-member{position:absolute;height:58%;aspect-ratio:509/556;bottom:2%;transform:translateX(-50%);transform-origin:50% 100%;pointer-events:none;z-index:10;transition:left var(--mv,.45s) cubic-bezier(.2,.8,.3,1),bottom var(--mv,.45s) cubic-bezier(.2,.8,.3,1)}
    .family-member.dragging{z-index:50;transition:none}.family-member.instant{transition:none}
    .pose-wrap{position:absolute;inset:0;transform-origin:50% 100%;transform:scale(var(--depth-scale,1));transition:transform .45s}.pose-wrap:before{content:"";position:absolute;left:28%;right:28%;bottom:1.5%;height:3.6%;border-radius:50%;background:radial-gradient(#3b2a2262,#3b2a2200 72%)}
    .family-member.dragging .pose-wrap,.family-member.instant .pose-wrap{transition:none}
    .pose-pop{position:absolute;inset:0;transform-origin:50% 100%}.pose-pop.popping{animation:pose-pop .12s ease-out}@keyframes pose-pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
    .char-img{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 4px 2px #4a332c3d);pointer-events:none}.family-member.dragging .char-img{filter:drop-shadow(0 13px 6px #49362855)}
    .hit{position:absolute;pointer-events:auto;touch-action:none;cursor:grab}.family-member.dragging .hit{cursor:grabbing}.family-member.locked-member .hit{cursor:not-allowed}
    .family-member:after{content:attr(data-gag);position:absolute;left:50%;top:calc(var(--bt,8)*1%);transform:translate(-50%,-100%);white-space:nowrap;background:#fff7dc;border:3px solid #4e3933;border-radius:18px;padding:3px 9px;font-weight:900;font-size:clamp(9px,1.5vh,15px);opacity:0;transition:.15s;z-index:5;pointer-events:none}.family-member[data-gag]:after{opacity:1}
    .cond-bar{position:absolute;left:3%;right:3%;top:2%;display:flex;gap:6px;z-index:15;pointer-events:none}
    .cond{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:#fff9e9ee;border:3px solid #8f5544;border-radius:14px;padding:5px 8px;box-shadow:0 4px 0 #7b4a3c55;font-weight:900;font-size:clamp(10px,1.7vh,17px);word-break:keep-all;line-height:1.2}
    .cond i{flex:none;width:1.6em;height:1.6em;border-radius:50%;border:3px solid #b98c7a;display:grid;place-items:center;font-style:normal;color:transparent;font-size:.9em}
    .cond.ok{background:#e8f8dcf2;border-color:#4f9a62}.cond.ok i{background:#4f9a62;border-color:#4f9a62;color:#fff}.cond.pop{animation:cond-pop .45s}
    @keyframes cond-pop{0%{transform:scale(1)}35%{transform:scale(1.12) rotate(-1.5deg)}70%{transform:scale(.97)}100%{transform:scale(1)}}
    .big-count{position:absolute;left:50%;top:17%;transform:translateX(-50%);z-index:16;pointer-events:none;font-family:'Gaegu',cursive;font-weight:900;font-size:clamp(90px,17vh,170px);line-height:1;color:#fff;-webkit-text-stroke:6px #d84d44;paint-order:stroke fill;text-shadow:0 8px 0 #7b2d27aa;opacity:0}
    .big-count.show{opacity:.82;animation:count-pop .5s ease-out}@keyframes count-pop{0%{transform:translateX(-50%) scale(1.6);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:.82}}
    .coach{position:absolute;left:42%;bottom:3%;transform:translateX(-50%);z-index:14;pointer-events:none;background:#392e2de0;color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:clamp(11px,1.8vh,18px);white-space:nowrap;display:none;word-break:keep-all}.coach.show{display:block;animation:coach-bob 1.1s ease-in-out infinite alternate}@keyframes coach-bob{to{transform:translateX(-50%) translateY(-6px)}}
    .photo-pet{position:absolute;display:none;width:39%;height:24%;object-fit:contain;object-position:center bottom;left:-18%;bottom:14%;transform:translateX(-50%);z-index:55;pointer-events:none;filter:drop-shadow(0 4px 2px #432b2344)}
    .photo-pet.draggable{cursor:grab}.photo-pet.dragging{cursor:grabbing;filter:drop-shadow(0 10px 4px #432b2366)}
    .shutter{--heat:0;position:absolute;right:3%;bottom:4%;z-index:30;width:clamp(66px,11vh,116px);aspect-ratio:1;border-radius:50%;border:8px solid color-mix(in srgb,#fff calc((1 - var(--heat))*100%),#e5122d);background:var(--red);box-shadow:0 0 0 5px #633f38,0 8px 0 #3c2f2b,0 0 calc(var(--heat)*26px) calc(var(--heat)*8px) #e5122d99;cursor:pointer;display:grid;place-items:center;color:white;font-size:clamp(26px,4.5vh,54px);touch-action:manipulation}.shutter:active{transform:translateY(6px);box-shadow:0 0 0 5px #633f38,0 2px 0 #3c2f2b}
    .flash{position:absolute;inset:0;background:white;z-index:100;pointer-events:none;opacity:0}.flash.fire{animation:flash .42s}@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
    .toast{position:absolute;left:50%;top:15%;transform:translate(-50%,-20px);background:#392e2dd9;color:white;border-radius:999px;padding:9px 18px;font-weight:900;font-size:clamp(11px,1.8vh,19px);z-index:40;opacity:0;transition:.2s;white-space:nowrap;pointer-events:none;word-break:keep-all}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.hot{background:#d84d44}
    .mission-intro{position:absolute;inset:0;z-index:110;background:#2b2222b8;display:none;place-items:center;padding:5%}.mission-intro.show{display:grid}.mission-card{width:min(540px,90%);background:#fff9e9;border:6px solid var(--red);border-radius:24px;padding:5%;text-align:center;box-shadow:0 16px 0 #7b3f39}
    .mission-kicker{font-weight:900;color:#9b6255;font-size:clamp(11px,1.7vh,16px)}.mission-card h3{font-family:'Gaegu';font-size:clamp(32px,5.5vh,58px);line-height:1;margin:8px 0;color:#d94f47;word-break:keep-all}
    .cond-list{list-style:none;margin:12px 0 10px;padding:0;display:grid;gap:8px}.cond-list li{background:#ffe9a8;border-radius:14px;padding:10px 14px;font-weight:900;word-break:keep-all;font-size:clamp(14px,2vh,20px)}.cond-list li b{color:#d94f47;margin-right:6px}
    .mission-tip{font-size:.8em;font-weight:800;margin:0 0 16px;color:#76584e;word-break:keep-all;text-wrap:balance}
    /* ===== 결과 ===== */
    .result-screen{align-items:flex-start;justify-content:center;background:#292121;padding:2vh 3vw;overflow-y:auto}
    .result-wrap{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:1.4vh}
    .photo{--r:.5;--ph:52vh;position:relative;background:#f9f1d9;padding:10px 10px 38px;transform:rotate(-1.2deg);box-shadow:0 20px 45px #0008;flex:none}
    .photo.shake{animation:photo-shake .5s}@keyframes photo-shake{0%,100%{transform:rotate(-1.2deg)}15%{transform:rotate(1.4deg) translate(4px,-3px)}35%{transform:rotate(-2.4deg) translate(-5px,3px)}55%{transform:rotate(.8deg) translate(3px,2px)}75%{transform:rotate(-1.8deg)}}
    .photo-scene{isolation:isolate;position:relative;overflow:hidden;background:url('assets/poses/living-room2.png') center/cover no-repeat;height:var(--ph);aspect-ratio:var(--r);width:auto;max-width:100%}
    .photo-scene.develop{animation:develop .9s ease-out both}
    @keyframes develop{0%{clip-path:inset(0 0 100% 0);filter:blur(12px) sepia(1) brightness(1.6)}55%{clip-path:inset(0 0 0 0);filter:blur(5px) sepia(.7) brightness(1.25)}100%{clip-path:inset(0);filter:none}}
    .mini-image{position:absolute;bottom:1%;left:50%;width:19%;height:72%;object-fit:contain;object-position:center bottom;transform:translateX(-50%);transform-origin:50% 100%;filter:drop-shadow(0 4px 2px #432b2344)}
    .mini-image.faithful-image{object-fit:contain;object-position:center bottom;transform:translateX(-50%)!important;max-width:none!important;margin:0!important;animation:none!important}
    .photo-caption{position:absolute;left:50%;top:3%;transform:translateX(-50%) rotate(-2deg);background:#fff47d;color:#49302b;border:3px solid #49302b;border-radius:12px;padding:4px 12px;font-family:'Gaegu',cursive;font-size:clamp(15px,2.6vh,28px);font-weight:900;text-align:center;line-height:1.1;width:max-content;max-width:90%;word-break:keep-all;text-wrap:balance;z-index:80}
    .result-screen .photo-caption{opacity:0}.result-screen .photo-caption.in{animation:cap-in .45s cubic-bezier(.2,1.5,.4,1) forwards}@keyframes cap-in{0%{opacity:0;transform:translateX(-50%) rotate(-2deg) scale(.4)}100%{opacity:1;transform:translateX(-50%) rotate(-2deg) scale(1)}}
    .date-stamp{position:absolute;right:5%;bottom:2.4%;font-family:monospace;color:#d65b46;font-weight:900;font-size:clamp(10px,1.6vh,17px)}
    .stamp{position:absolute;left:34%;top:95%;z-index:90;width:max-content;white-space:normal;text-align:center;max-width:64%;word-break:keep-all;transform:translate(-50%,-50%) rotate(-8deg);padding:3px 12px;border:4px solid currentColor;border-radius:12px;font-family:'Gaegu',cursive;font-weight:900;font-size:clamp(20px,3.4vh,36px);line-height:1;opacity:0;pointer-events:none;background:#fff8e5cc;letter-spacing:-.02em}
    .stamp.normal{color:#6b7f8f}.stamp.funny{color:#e0932f}.stamp.disaster{color:#d63d34}.stamp.legend{color:#b8860b;background:#fff3b0e6;font-size:clamp(18px,3vh,32px)}
    .stamp.slam{animation:slam .42s cubic-bezier(.2,1.5,.4,1) forwards}.stamp.big.slam{animation:slam-big .6s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(3)}65%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(.92)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
    @keyframes slam-big{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(4.2)}55%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(.88)}75%{transform:translate(-50%,-50%) rotate(-9deg) scale(1.08)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
    .result-info{width:100%;color:white;text-align:center;padding-bottom:2vh}
    .result-comment{min-height:2.6em;font-size:clamp(12px,1.9vh,18px);margin:4px auto 8px;color:#f3d8ca;word-break:keep-all;max-width:92%;font-weight:700}
    .score-rows{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 auto 6px;max-width:92%}
    .score-row{background:#3c302d;border-radius:12px;padding:5px 4px}.score-row small{display:block;font-size:clamp(10px,1.5vh,13px);color:#e8c9bb;font-weight:700}.score-row b{font-size:clamp(17px,2.8vh,26px);color:#ffdf71;font-variant-numeric:tabular-nums}
    .score-total{font-size:clamp(14px,2.2vh,20px);font-weight:900;margin:2px 0 6px;color:#fff}.score-total b{font-size:1.9em;color:#ffdf71;margin-left:6px;font-variant-numeric:tabular-nums}
    .best-new{color:#ffdf71;font-weight:900;min-height:1.3em;font-size:clamp(12px,1.8vh,16px)}
    .result-actions{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px}.result-actions .row{display:flex;gap:8px;justify-content:center}
    .next-btn{font-size:clamp(14px,2.1vh,22px)}.sub-btn{background:#755b52;box-shadow:0 6px 0 #3d2e2b;font-size:clamp(12px,1.7vh,16px);padding:.55em 1.2em}.main-btn{padding:.75em 2.6em;font-size:clamp(17px,2.6vh,26px)}
    /* ===== 앨범 ===== */
    .gallery-screen{flex-direction:column;background:#f6ead0;padding:2.5%;overflow:auto}.gallery-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.gallery-head h2{font-family:'Gaegu';font-size:clamp(32px,5.5vh,66px);margin:0;color:#d75048}.close-gallery{border:0;background:#3c302d;color:white;border-radius:999px;padding:10px 18px;font-weight:900;cursor:pointer;flex:none}.gallery-copy{margin:0 0 2%;font-weight:700;color:#76584e;word-break:keep-all}
    .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:1% 1% 5%;align-items:start}
    .gallery-card{background:white;padding:8px 8px 34px;box-shadow:0 8px 18px #6b4d3a33;transform:rotate(var(--tilt));position:relative}.gallery-card .photo-scene{height:auto;width:100%;aspect-ratio:var(--r)}.gallery-card .photo-caption{font-size:clamp(11px,1.7vh,16px);padding:2px 7px;border-width:2px}
    .gallery-card footer{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;gap:6px;font-size:clamp(9px,1.3vh,13px);font-weight:900;color:#79584d}.gallery-card footer span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .gallery-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
    .gallery-tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 2%}.gallery-tools[hidden]{display:none}.gt-btn{border:2px solid #3c302d;background:#fff;color:#3c302d;border-radius:999px;padding:8px 14px;font-weight:900;cursor:pointer;font-family:inherit}.gt-btn:disabled{opacity:.4;cursor:default}.gt-reset{margin-left:auto;border-color:#d75048;color:#d75048}
    .gallery-sel{position:absolute;left:6px;top:6px;z-index:95;width:30px;height:30px;margin:0;accent-color:#d75048;cursor:pointer}

<script id="logic">

9.5],"faceVisible":true},"sis-p1":{"char":"sis","n":1,"file":"assets/poses/sis-p1.png","role":"chaos","bbox":[186,122,366,537],"face":[62.5,36.0],"faceVisible":false,"sev":1,"key":"phone","points":70},"sis-p2":{"char":"sis","n":2,"file":"assets/poses/sis-p2.png","role":"chaos","bbox":[188,109,380,535],"face":[53.5,33.5],"faceVisible":true,"sev":2,"key":"startled","points":100,"reaction":"cat"},"sis-p3":{"char":"sis","n":3,"file":"assets/poses/sis-p3.png","role":"chaos","bbox":[141,114,424,492],"face":[51.6,36.1],"faceVisible":true,"sev":3,"key":"jump","points":100,"airborne":true},"sis-p4":{"char":"sis","n":4,"file":"assets/poses/sis-p4.png","role":"base","bbox":[175,95,348,542],"face":[50.9,31.2],"faceVisible":true},"sis-p5":{"char":"sis","n":5,"file":"assets/poses/sis-p5.png","role":"wave","bbox":[162,92,389,542],"face":[50.0,32.4],"faceVisible":true,"label":"손인사"},"sis-p6":{"char":"sis","n":6,"file":"assets/poses/sis-p6.png","role":"special","bbox":[153,109,406,538],"face":[53.9,35.8],"faceVisible":true,"label":"윙크 브이"},"bro-p1":{"char":"bro","n":1,"file":"assets/poses/bro-p1.png","role":"chaos","bbox":[112,182,378,536],"face":[56.4,49.1],"faceVisible":true,"sev":3,"key":"run","points":130,"reaction":"cat","moves":"x"},"bro-p2":{"char":"bro","n":2,"file":"assets/poses/bro-p2.png","role":"chaos","bbox":[115,234,400,530],"face":[48.0,59.9],"faceVisible":true,"sev":1,"key":"crouch","points":70},"bro-p3":{"char":"bro","n":3,"file":"assets/poses/bro-p3.png","role":"special","bbox":[138,229,365,533],"face":[50.2,55.1],"faceVisible":true,"label":"메롱"},"bro-p4":{"char":"bro","n":4,"file":"assets/poses/bro-p4.png","role":"chaos","bbox":[143,151,366,457],"face":[50.0,42.0],"faceVisible":true,"sev":2,"key":"jump","points":100,"airborne":true},"bro-p5":{"char":"bro","n":5,"file":"assets/poses/bro-p5.png","role":"wave","bbox":[122,147,363,537],"face":[50.5,41.7],"faceVisible":true,"label":"손인사"},"bro-p6":{"char":"bro","n":6,"file":"assets/poses/bro-p6.png","role":"base","bbox":[167,140,354,535],"face":[51.5,39.9],"faceVisible":true}};
const BASE={mom:'mom-p1',dad:'dad-p6',sis:'sis-p4',bro:'bro-p6'};
const poseOfRole=(id,role)=>Object.keys(POSE_META).find(k=>POSE_META[k].char===id&&POSE_META[k].role===role);
const WAVE={},SPECIAL={},REACT={};['mom','dad','sis','bro'].forEach(id=>{WAVE[id]=poseOfRole(id,'wave');SPECIAL[id]=poseOfRole(id,'special');const r=Object.keys(POSE_META).find(k=>POSE_META[k].char===id&&POSE_META[k].reaction==='cat');if(r)REACT[id]=r});
const STAGING_LIMIT=15,CHAOS_SECONDS=8,HOLD=1.1,CAT_HOLD=1.4,SETTLE=.5,READY_HOLD=.3,READY_NOTICE=.6,A_DEFAULT=390/768,HC0=58; /* HC0: 컨테이너 높이(stage 높이 %), 세로 화면 CSS 와 동일 */
const MIN_Y=-30,NEAR_K=.025,FACE_MIN_H=12;   /* y<0: 발이 프레임 아래로 나간 '카메라 바로 앞' 구간. 배율은 1 을 넘어 커진다 */
const depthScale=y=>y<0?1-y*NEAR_K:Math.max(.68,1-y*.007);
const zOf=y=>40-Math.round(y);
const MULT={1:1,.5:.55,0:.25};
const STAGE_MAX=94;

/* 컨테이너 사각형(c) + 포즈 → 눈에 보이는 영역 기준 측정값 */
function poseMetrics(poseId,c){const P=POSE_META[poseId],b=P.bbox,w=(b[2]-b[0])/CANVAS.w*c.wc,h=(b[3]-b[1])/CANVAS.h*c.hc;
  return{id:P.char,poseId,role:P.role,faceOK:P.faceVisible!==false,
    cx:c.cx+((b[0]+b[2])/2/CANVAS.w-.5)*c.wc,bottom:c.bottom+(CANVAS.h-b[3])/CANVAS.h*c.hc,w,bw:w,h,s:c.s,z:c.z,
    face:{x:c.cx+(P.face[0]/100-.5)*c.wc,y:100-(c.bottom+(1-P.face[1]/100)*c.hc)}}}
/* 논리 위치(x,y) → 측정값. wc0/hc0 = 배율 1 일 때 컨테이너 크기(stage %) */
function buildMember(sp,A){const hc0=sp.hc0||HC0,wc0=sp.wc0||hc0*(CANVAS.w/CANVAS.h)/(A||A_DEFAULT),s=depthScale(sp.y);
  const m=poseMetrics(sp.poseId,{cx:sp.x,bottom:sp.y,wc:wc0*s,hc:hc0*s,s,z:zOf(sp.y)});return Object.assign(m,{x:sp.x,y:sp.y,wc0,hc0,A:A||A_DEFAULT})}
function nominalMember(id,x,y,poseId){return buildMember({id,poseId:poseId||BASE[id],x,y},A_DEFAULT)}
const withPose=(m,poseId)=>{const lim=limitsFor(poseId,m.wc0,m.hc0,m.y);return buildMember({poseId,x:Math.max(lim.minX,Math.min(lim.maxX,m.x)),y:m.y,wc0:m.wc0,hc0:m.hc0},m.A)};   /* 포즈가 넓어져도 눈에 보이는 영역은 화면 안 */
/* 화면 안에 눈에 보이는 영역이 들어가는 x/y 한계 (드래그 경계·사고 이동 공통) */
/* 좌우: 몸 일부는 프레임 밖으로 나가도 된다(OVERHANG). 단 얼굴 앵커는 프레임 안(FACE_X_MIN~MAX)에 남아 다시 잡을 수 있다 */
const OVERHANG=.4,FACE_X_MIN=8,FACE_X_MAX=92;
function limitsFor(poseId,wc0,hc0,y){const P=POSE_META[poseId],b=P.bbox,s=depthScale(y),wcs=wc0*s,L=(.5-b[0]/CANVAS.w)*wcs,R=(b[2]/CANVAS.w-.5)*wcs,over=OVERHANG*(R+L),fo=(P.face[0]/100-.5)*wcs;
  return{minX:Math.max(L-over,FACE_X_MIN-fo),maxX:Math.min(100-R+over,FACE_X_MAX-fo)}}
/* 신발이 설 수 있는 가장 뒤쪽 바닥선(화면 아래에서 %). 배경 표시 방식(세로 cover/가로 cover)에 따라 DOM 쪽이 갱신한다 */
let FLOOR_FEET=20;
function maxYFor(poseId,hc0){const b=POSE_META[poseId].bbox,a=(CANVAS.h-b[1])/CANVAS.h*hc0;let y=STAGE_MAX-a;for(let i=0;i<4;i++)y=STAGE_MAX-a*depthScale(y);

/* 8초 촬영 구간: ① 레벨의 '앵커 사건'(구도를 깨는 사고, 원래 3초 시각표를 8초로 늘림) + ② 인물별로 어긋난 주기 행동(필러).
   필러: 인물마다 시작 시각을 0.5초 이상 엇갈리게 하고 1.5~2.5초 간격으로 자기 사고 포즈를 돌아가며, 일정 시간(hold) 후 원래 자세로 복귀.

const FILL_BUBBLE={startled:'앗!',jump:'점프!',sneeze:'에취!',phone:'알림!',run:'뛰어!'};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildEvents(lv,diff,seed,noFill){const K=CHAOS_SECONDS/3,sd=seed!=null?seed:[...lv.id].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7),R=rng(sd);
  const anchor=e=>Object.assign({},e,{at:+(e.at*K).toFixed(2),hold:e.kind==='cat'?CAT_HOLD:HOLD+.2});
  let ev=lv.chaos.map(anchor);
  if(diff==='easy'){ev=ev.map(e=>Object.assign({},e,{at:+(e.at-.8).toFixed(2)}));if(lv.dropSecond){const n=ev.filter(e=>e.kind!=='cat');if(n.length>1)ev=ev.filter(e=>e!==n[1])}}
  if(diff==='chaos'){const a0=ev.reduce((m,e)=>Math.max(m,e.at),0);ev=ev.map(e=>Object.assign({},e,{at:+(a0-(a0-e.at)*.75).toFixed(2)}));ev.push(anchor(lv.extra))}
  const anchors=ev.slice();if(noFill)return ev.sort((a,b)=>b.at-a.at);const ids=['mom','dad','sis','bro'].map(v=>[R(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  ids.forEach((id,i)=>{const pool=Object.keys(POSE_META).filter(k=>POSE_META[k].char===id&&POSE_META[k].role==='chaos'&&!anchors.some(e=>e.pose===k)).map(k=>[R(),k]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    let t=CHAOS_SECONDS-.9-i*.55-R()*.5,n=0,last=null;
    while(t>=1.0&&n<pool.length){const own=anchors.filter(e=>e.actor===id);
      for(let k=0;k<12&&ev.some(e=>Math.abs(e.at-t)<.45);k++)t-=.1;   /* 다른 행동과 겹치면 조금씩 밀어서 배치 */
      if(t>=.9&&R()>.1&&!own.some(e=>Math.abs(e.at-t)<1.5)&&!ev.some(e=>Math.abs(e.at-t)<.45)){let k=pool[n%pool.length];if(k===last){n++;k=pool[n%pool.length]}n++;last=k;const P=POSE_META[k];
        ev.push({id:'f_'+id+'_'+ev.length,at:+t.toFixed(2),actor:id,pose:k,filler:true,hold:+(HOLD+R()*.4).toFixed(2),bubble:P.sev>=2?FILL_BUBBLE[P.key]||null:null})}

/* ----- 점수·등급 (포즈 상태 기준) -----
   구도 = (round(80×compRate)+min(20,7×연출포즈 인원))×4   연출포즈 = wave/special 이면서 얼굴이 보이는 포즈
   순간 = 지금 chaos 포즈인 인물의 포즈 점수 합 × 배율,  사고 = (두 명 이상 동시 사고 +250, 고양이 +300) × 배율 */
function rarityOf(lv,compRate,accident,eventCount){const r=lv.rarity;
  if(compRate>=.5&&eventCount>=2&&accident>=r.legend)return'legend';
  if(accident>=r.disaster)return'disaster';
  if(accident>=r.funny)return'funny';return'normal'}
function scoreSnapshot(lv,ms,A,opt){opt=opt||{};
  const conds=evaluateConditions(lv,ms,A),met=conds.filter(Boolean).length,compRate=met/lv.conds.length,mult=MULT[compRate];
  const staged=ms.filter(m=>(m.role==='wave'||m.role==='special')&&m.faceOK&&faceInFrame(m)).length;
  const chaosMs=ms.filter(m=>m.role==='chaos'),single=chaosMs.reduce((a,m)=>a+POSE_META[m.poseId].points,0);
  const duo=chaosMs.length>=2,cat=!!opt.catVisible,bonus=(duo?DUO_BONUS:0)+(cat?CAT_BONUS:0);
  const comp=(Math.round(80*compRate)+Math.min(20,7*staged))*4,moment=Math.round(single*mult),chaos=Math.round(bonus*mult),accident=moment+chaos;
  const events=chaosMs.map(m=>POSE_META[m.poseId].key).concat(cat?['cat']:[]);
  return{conds,met,compRate,mult,staged,comp,moment,chaos,accident,total:comp+accident,events,flags:{duo,cat},rarity:rarityOf(lv,compRate,accident,events.length)}}

/* ----- 사고가 구도를 무너뜨리는 결정적 계획 -----
   사고 인물·시점·포즈는 고정. 이동 '방향'만 현재 구도의 약한 고리를 깨는 쪽(충족 수 최소, 동률이면 최소 이동)으로 고른다. */
const BUMP_DX=[-22,-14,14,22],BUMP_DY=[0,10,18,26,-8];
function planMoves(lv,ms,A,ev,locked){
  const avoid=new Set([...(ev.avoid||[]),...(locked||[])]);let cur=ms.map(m=>Object.assign({},m));const plan=[];
  const apply=(arr,c)=>arr.map(m=>m.id!==c.id?m:(c.reset?withPose(m,BASE[m.id]):moveM(m,c.x,c.y)));
  const met=arr=>evaluateConditions(lv,arr,A).filter(Boolean).length;
  const pick=cands=>{let b=null;for(const c of cands){const n=met(apply(cur,c));if(!b||n<b.n||(n===b.n&&c.cost<b.c.cost))b={c,n}}return b};
  const put=c=>{cur=apply(cur,c);plan.push(c)};
  if(ev.move&&ev.actor){const a=byId(cur,ev.actor),yMax=maxYFor(a.poseId,a.hc0),cands=[];
    ev.move.dxs.forEach(dx=>(ev.move.dys||[0]).forEach(dy=>cands.push({id:a.id,x:a.x+dx,y:Math.max(minYFor(a.poseId,a.hc0),Math.min(yMax,a.y+dy)),cost:Math.abs(dx)+Math.abs(dy),kind:'actor'})));
    const b=pick(cands);if(b)put(b.c)}
  if(ev.bump&&(ev.bump==='always'||met(cur)===lv.conds.length)){
    const cands=[];cur.forEach(v=>{if(v.id===ev.actor)return;const yMax=maxYFor(v.poseId,v.hc0);
      if(!avoid.has(v.id))BUMP_DX.forEach(dx=>BUMP_DY.forEach(dy=>{cands.push({id:v.id,x:v.x+dx,y:Math.max(minYFor(v.poseId,v.hc0),Math.min(yMax,v.y+dy)),cost:Math.abs(dx)+Math.abs(dy),kind:'bump'})}));
      if(v.role==='special'||v.role==='wave')cands.push({id:v.id,reset:true,cost:5,kind:'reset'})});
    const base=met(cur),b=pick(cands);
    if(b&&(ev.bump==='always'||b.n<base))put(b.c);
    else if(ev.bump===true){/* 한 명으로 안 깨지면 두 명을 연달아 밀친다 */
      let bp=null;for(const c1 of cands){const a1=apply(cur,c1);for(const c2 of cands){if(c2.id===c1.id)continue;const n=met(apply(a1,c2)),cost=c1.cost+c2.cost;if(n<base&&(!bp||n<bp.n||(n===bp.n&&cost<bp.cost)))bp={c1,c2,n,cost}}}
      if(bp){put(bp.c1);put(bp.c2)}}}
  return plan}

/* ----- 고양이 연쇄 반응: 고양이와 가장 가까운 최대 2명(거리 → 인물 ID 순)이 자기 반응 포즈로 전환 ----- */
function catReactions(ms,A,pos){const P=pos||CAT_POS;
  const order=ms.filter(m=>REACT[m.id]).map(m=>({m,d:distW(ctr(m),P,A||A_DEFAULT)})).sort((a,b)=>a.d-b.d||(a.m.id<b.m.id?-1:1)).slice(0,2);
  return order.map(({m})=>({id:m.id,poseId:REACT[m.id],dx:m.id==='bro'?(m.x<P.x?9:-9):0}))}
/* 반응 적용(순수): 포즈 교체 + (동생) 고양이 쪽 이동 */
function applyReactions(ms,A){return catReactions(ms,A).reduce((arr,r)=>arr.map(m=>{if(m.id!==r.id)return m;const p=withPose(m,r.poseId);return r.dx?moveM(p,p.x+r.dx,p.y):p}),ms)}

/* 시뮬레이션: startMembers(구도 완성 상태)에서 남은 T초에 셔터를 눌렀을 때의 결과 */
function simulateShot(lv,startMembers,A,T,diff,noFill,seed){

    later(()=>countUp($('#scComp'),rec.scoreParts.comp,420,()=>countUp($('#scMoment'),rec.scoreParts.moment,420,()=>countUp($('#scChaos'),rec.scoreParts.chaos,420,()=>countUp($('#scTotal'),rec.score,520,()=>{if(isBest)$('#newBest').textContent='🏆 새로운 최고 기록!'})))),1500);
    savePhoto(rec)}

  /* ---------- 앨범·저장 ---------- */
  function loadPhotos(){try{return JSON.parse(store.get(KEY.gallery,'[]'))}catch{return[]}}
  function savePhoto(record){const list=loadPhotos();list.unshift(record);try{localStorage.setItem(KEY.gallery,JSON.stringify(list.slice(0,12)))}catch{}renderGallery()}
  /* ---------- 앨범 선택: 다운로드·삭제·새로고침 ---------- */
  const sel=new Set();
  function updateTools(total){const n=sel.size;$('#galleryTools').hidden=!total;$('#dlSel').textContent='선택 다운로드'+(n?` (${n})`:'');$('#delSel').textContent='선택 삭제'+(n?` (${n})`:'');$('#dlSel').disabled=$('#delSel').disabled=!n;$('#selAll').textContent=n&&n===total?'선택 해제':'전체 선택'}
  const loadImg=src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src});
  /* 사진은 배치 정보로 저장돼 있어서, 내려받을 때 캔버스에 같은 모습으로 다시 그린다 */
  async function photoCanvas(r){
    const W=1200,ratio=Number(r.stageRatio)||.5,H=Math.round(W/ratio),u=W/700,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
    try{await document.fonts.ready}catch{}
    const bg=await loadImg(r.bg||'assets/living-room.png'),k=Math.max(W/bg.width,H/bg.height);g.drawImage(bg,(W-bg.width*k)/2,(H-bg.height*k)/2,bg.width*k,bg.height*k);
    const items=[...r.members.map(p=>({src:poseSrc(p),box:p.box||{cx:Math.max(14,Math.min(86,Number.isFinite(Number(p.x))?Number(p.x):legacyX[p.id])),bottom:1,w:22,h:70,z:10}})),...(r.props||[]).map(p=>({src:p.src,box:p.box,flip:p.flip}))].sort((a,b)=>(a.box.z||10)-(b.box.z||10));
    for(const it of items){const im=await loadImg(it.src).catch(()=>null);if(!im)continue;const b=it.box,bw=b.w/100*W,bh=b.h/100*H,sc=Math.min(bw/im.width,bh/im.height),dw=im.width*sc,dh=im.height*sc;
      g.save();g.shadowColor='#432b2344';g.shadowBlur=4*u;g.shadowOffsetY=3*u;if(r.effect==='shake')g.filter=`blur(${1.8*u}px)`;if(it.flip){g.translate(b.cx/100*W,0);g.scale(-1,1);g.drawImage(im,-dw/2,H-b.bottom/100*H-dh,dw,dh)}else g.drawImage(im,b.cx/100*W-dw/2,H-b.bottom/100*H-dh,dw,dh);g.restore()}
    if(r.effect==='finger'){g.save();g.filter=`blur(${3*u}px)`;g.fillStyle='#c76d58dd';g.translate(W*.97,H*.09);g.rotate(-20*Math.PI/180);g.beginPath();g.ellipse(0,0,W*.16,H*.24,0,0,Math.PI*2);g.fill();g.restore()}
    const tag=(text,font,bgc,fg,border,cx,cy,rot)=>{g.save();g.font=font;const tw=g.measureText(text).width,pw=12*u,ph=5*u,w=tw+pw*2,hh=parseInt(font.match(/(\d+)px/)[1])*1.15+ph*2;g.translate(cx,cy);g.rotate(rot*Math.PI/180);g.beginPath();g.roundRect?g.roundRect(-w/2,-hh/2,w,hh,12*u):g.rect(-w/2,-hh/2,w,hh);g.fillStyle=bgc;g.fill();g.lineWidth=3*u;g.strokeStyle=border;g.stroke();g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.fillText(text,0,0);g.restore()};
    const text=r.title||r.caption||'';if(text){let fs=34*u;const f=()=>`900 ${fs}px Gaegu,'Noto Sans KR',sans-serif`;g.font=f();while(g.measureText(text).width>W*.84&&fs>14*u){fs-=2*u;g.font=f()}tag(text,f(),'#fff47d','#49302b','#49302b',W/2,H*.03+fs*.8,-2)}
    const st={shake:'흔들림 주의',finger:'손가락 출연',over:'플래시 폭발'}[r.effect];if(st)tag(st,`900 ${22*u}px Gaegu,'Noto Sans KR',sans-serif`,'#ef6558','#fff','#fff',W*.86,H*.94,-7);
    if(r.effect==='over'){const c2=document.createElement('canvas');c2.width=W;c2.height=H;const g2=c2.getContext('2d');g2.filter='brightness(1.45) contrast(.82) saturate(.75)';g2.drawImage(cv,0,0);return c2}
    return cv}
  const saveCanvas=(cv,name)=>new Promise(ok=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);ok()},'image/png'));
  const writePhotos=list=>{try{localStorage.setItem(KEY.gallery,JSON.stringify(list))}catch{}renderGallery()};
  $('#selAll').addEventListener('click',()=>{const cbs=$$('.gallery-sel'),all=cbs.length&&sel.size===cbs.length;sel.clear();cbs.forEach((c,i)=>{c.checked=!all;if(!all)sel.add(i)});updateTools(cbs.length)});
  $('#dlSel').addEventListener('click',async e=>{const btn=e.currentTarget,list=loadPhotos(),ids=[...sel].sort((a,b)=>a-b);if(!ids.length)return;btn.disabled=true;const old=btn.textContent;btn.textContent='저장 중…';
    try{for(const i of ids){const r=list[i];await saveCanvas(await photoCanvas(r),`찰칵우리가족_${r.scene||'거실'}${r.level||1}_${i+1}.png`);await new Promise(t=>setTimeout(t,350))}}catch{alert('사진을 저장하지 못했어요. 다시 시도해 주세요.')}
    btn.textContent=old;updateTools(list.length)});
  $('#delSel').addEventListener('click',()=>{const n=sel.size;if(!n||!confirm(`선택한 사진 ${n}장을 지울까요?\n지운 사진은 되돌릴 수 없어요.`))return;writePhotos(loadPhotos().filter((_,i)=>!sel.has(i)))});
  $('#resetAlbum').addEventListener('click',()=>{const n=loadPhotos().length;if(!n||!confirm(`앨범의 사진 ${n}장을 모두 지우고 새로 시작할까요?\n지운 사진은 되돌릴 수 없어요.`))return;writePhotos([])});
  function renderGallery(){const list=loadPhotos(),grid=$('#galleryGrid');sel.clear();updateTools(list.length);$('#galleryCount').textContent=list.length+'장';grid.innerHTML='';
    if(!list.length){grid.innerHTML='<div class="gallery-empty">아직 사진이 없어요.<br>멋지게 망쳐보세요!</div>';return}
    list.forEach((r,i)=>{const card=document.createElement('article');card.className='gallery-card';card.style.setProperty('--tilt','0deg');   // 기울이면 인물이 뭉개져 보여서 똑바로 둔다
      
      const scene=document.createElement('div');scene.className='photo-scene';scene.style.setProperty('--r',String(r.stageRatio||.5));scene.style.backgroundImage=`url('${r.bg||'assets/living-room.png'}')`;scenePhoto(scene,r);renderProps(scene,r);const cap=scene.querySelector('.photo-caption');if(cap)cap.classList.add('in');const frame=document.createElement('div');frame.className='gallery-frame';frame.appendChild(scene);card.appendChild(frame);card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','사진 크게 보기');card.addEventListener('click',()=>zoomPhoto(r));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoomPhoto(r)}});
      const v2=r.version===2,rar=v2&&RARITY[r.rarity];if(rar){const st=document.createElement('div');st.className='album-sticker '+r.rarity;st.textContent=rar.icon+' '+rar.label;card.appendChild(st)}else if(r.sticker){const st=document.createElement('div');st.className='album-sticker';st.textContent=r.sticker;card.appendChild(st)}
      const foot=document.createElement('footer');foot.innerHTML=`<span>${r.scene||'거실'} ${r.level||1}/${v2?LEVELS.length:9}</span><span>${Number(r.score||0).toLocaleString()}점</span>`;card.appendChild(foot);
      const cb=document.createElement('input');cb.type='checkbox';cb.className='gallery-sel';cb.setAttribute('aria-label','사진 선택');['click','keydown','pointerdown'].forEach(ev=>cb.addEventListener(ev,e=>e.stopPropagation()));cb.addEventListener('change',()=>{cb.checked?sel.add(i):sel.delete(i);updateTools(list.length)});card.appendChild(cb);grid.appendChild(card)})}
  function zoomPhoto(r){const box=$('#zoomBox');box.innerHTML='';const wrap=document.createElement('div');wrap.className='zoom-photo';const scene=document.createElement('div');scene.className='photo-scene';scene.style.setProperty('--r',String(r.stageRatio||.5));scene.style.backgroundImage=`url('${r.bg||'assets/living-room.png'}')`;scenePhoto(scene,r);renderProps(scene,r);const cap=scene.querySelector('.photo-caption');if(cap)cap.classList.add('in');wrap.appendChild(scene);
    const rar=r.version===2&&RARITY[r.rarity];const foot=document.createElement('div');foot.className='zoom-foot';foot.textContent=`${rar?rar.icon+' '+rar.label+' · ':''}${r.scene||'거실'} ${r.level||1}/${LEVELS.length} · ${Number(r.score||0).toLocaleString()}점`;wrap.appendChild(foot);box.appendChild(wrap);box.classList.add('open');wrap.style.setProperty('--r',String(r.stageRatio||.5))}
  function closeZoom(){$('#zoomBox').classList.remove('open')}
  function abortRound(){phase='idle';S.timers=[];S.pending=[];drag=null;pet.style.display='none';$('#bigCount').classList.remove('show');setCoach('')}
  function openGallery(){galleryReturn=screens.result.classList.contains('active')?'result':screens.game.classList.contains('active')?'game':screens.complete.classList.contains('active')?'complete':'title';if(galleryReturn==='game')abortRound();renderGallery();show('gallery')}
  function closeGallery(){if(galleryReturn==='result')show('result');else if(galleryReturn==='game')enterLevel();else show(galleryReturn)}
  function advance(){resultTimers.forEach(clearTimeout);if(currentLevel>=LEVELS.length){store.set(KEY.level,'1');currentLevel=1;show('complete');return}currentLevel++;store.set(KEY.level,String(currentLevel));enterLevel()}
  function retry(){resultTimers.forEach(clearTimeout);enterLevel(true)}
  function setDifficulty(v){if(!difficulties[v])v='normal';difficulty=v;store.set(KEY.diff,v);$$('.difficulty button').forEach(b=>b.classList.toggle('selected',b.dataset.difficulty===v));$('#startBtn').textContent=difficulties[v].button}
  $$('.difficulty button').forEach(b=>b.addEventListener('click',()=>setDifficulty(b.dataset.difficulty)));setDifficulty(difficulty);
  $('#startBtn').addEventListener('click',async()=>{sfx('go');if(currentLevel===1)order=newOrder();await preloadDone;enterLevel()});$('#missionStart').addEventListener('click',beginStaging);$('#nextBtn').addEventListener('click',advance);$('#retryBtn').addEventListener('click',retry);
  $('#shutter').addEventListener('click',takePhoto);
  stage.addEventListener('pointerdown',beginDrag);window.addEventListener('pointermove',moveDrag,{passive:false});window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);window.addEventListener('pointermove',movePetDrag,{passive:false});window.addEventListener('pointerup',endPetDrag);window.addEventListener('pointercancel',endPetDrag);
  $$('.open-gallery').forEach(b=>b.addEventListener('click',openGallery));$('#closeGallery').addEventListener('click',closeGallery);$('#zoomBox').addEventListener('click',closeZoom);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom()});
  $('#completeAlbum').addEventListener('click',openGallery);$('#completeAgain').addEventListener('click',()=>{currentLevel=1;store.set(KEY.level,'1');order=newOrder();enterLevel()});
  memberEls().forEach(m=>{m._base=0;resetPose(m)});
  renderGallery();
  /* 자동 검증(tools/e2e_check.js)용 읽기 전용 훅 */
  window.__game={get phase(){return phase},get S(){return S},get cfg(){return cfg},get dragId(){return drag&&drag.m.dataset.id},get dragMoved(){return !!(drag&&drag.moved)},get preloaded(){return preloadDone},measure,measureLogical,evaluateConditions,boxes:()=>{const sr=stage.getBoundingClientRect();return memberEls().map(m=>Object.assign({id:m.dataset.id,poseId:m.dataset.poseId},containerBox(m,sr)))}};
</script>
