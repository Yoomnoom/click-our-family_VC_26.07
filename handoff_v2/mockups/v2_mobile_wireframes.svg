<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <rect width="1440" height="920" fill="#f4efe5"/>
  <style>
    .phone{fill:#fffaf0;stroke:#3d302e;stroke-width:5}.stage{fill:#ead9ba;stroke:#9c765e;stroke-width:3}
    .card{fill:#fff;stroke:#d25b50;stroke-width:3}.ok{fill:#dff1c9}.btn{fill:#ef6558}.sub{fill:#ffe08a}
    .t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#382c2a;font-weight:700}.sm{font-size:15px}.md{font-size:21px}.lg{font-size:29px}
    .person{fill:#f6c7a3;stroke:#503b36;stroke-width:3}.body{fill:#81a08c;stroke:#503b36;stroke-width:3}
  </style>
  <text x="40" y="48" class="t lg">찰칵! 우리 가족 V2 — 모바일 화면 목업</text>

  <!-- Briefing -->
  <g transform="translate(40 80)">
    <rect class="phone" x="0" y="0" rx="28" width="300" height="780"/>
    <text x="25" y="48" class="t sm">거실 1/3</text>
    <text x="25" y="95" class="t lg">우리 집 삼각형</text>
    <text x="25" y="128" class="t sm">조건만 지키고 자유롭게 연출!</text>
    <rect class="card" x="22" y="170" rx="16" width="256" height="74"/>
    <text x="45" y="214" class="t md">얼굴 3개 보이기</text>
    <rect class="card" x="22" y="260" rx="16" width="256" height="74"/>
    <text x="45" y="304" class="t md">삼각 구도 만들기</text>
    <rect class="card" x="22" y="350" rx="16" width="256" height="74"/>
    <text x="45" y="394" class="t md">한 명은 크게</text>
    <rect class="btn" x="35" y="680" rx="28" width="230" height="62"/>
    <text x="98" y="719" fill="white" class="t md">연출 시작</text>
    <text x="88" y="770" class="t sm">1. 조건 브리핑</text>
  </g>

  <!-- Staging -->
  <g transform="translate(390 80)">
    <rect class="phone" x="0" y="0" rx="28" width="300" height="780"/>
    <text x="18" y="40" class="t sm">거실 1/3</text>
    <rect class="ok" x="15" y="58" rx="11" width="82" height="44"/><text x="27" y="85" class="t sm">✓ 얼굴 3</text>
    <rect class="card" x="105" y="58" rx="11" width="82" height="44"/><text x="118" y="85" class="t sm">△ 삼각형</text>
    <rect class="ok" x="195" y="58" rx="11" width="90" height="44"/><text x="208" y="85" class="t sm">✓ 한 명 크게</text>
    <rect class="stage" x="12" y="116" rx="14" width="276" height="570"/>
    <circle class="person" cx="76" cy="310" r="25"/><rect class="body" x="48" y="335" rx="16" width="56" height="110"/>
    <circle class="person" cx="153" cy="225" r="31"/><rect class="body" x="118" y="256" rx="18" width="70" height="145"/>
    <circle class="person" cx="220" cy="335" r="24"/><rect class="body" x="193" y="359" rx="15" width="54" height="105"/>
    <circle class="person" cx="135" cy="455" r="21"/><rect class="body" x="111" y="476" rx="14" width="48" height="96"/>
    <circle class="btn" cx="244" cy="631" r="37"/><text x="224" y="640" fill="white" class="t md">찰칵</text>
    <text x="98" y="720" class="t md">촬영 가능!</text>
    <text x="90" y="770" class="t sm">2. 자유 배치</text>
  </g>

  <!-- Chaos -->
  <g transform="translate(740 80)">
    <rect class="phone" x="0" y="0" rx="28" width="300" height="780"/>
    <text x="18" y="40" class="t sm">사고 타임</text>
    <rect class="stage" x="12" y="65" rx="14" width="276" height="621"/>
    <text x="132" y="145" class="t lg" fill="#d84d44">2</text>
    <rect class="sub" x="58" y="162" rx="18" width="184" height="45"/><text x="87" y="191" class="t sm">아빠 눈 감는다!</text>
    <circle class="person" cx="74" cy="330" r="25"/><rect class="body" x="46" y="355" rx="16" width="56" height="110"/>
    <circle class="person" cx="153" cy="240" r="31"/><rect class="body" x="118" y="271" rx="18" width="70" height="145"/>
    <circle class="person" cx="220" cy="315" r="24"/><rect class="body" x="193" y="339" rx="15" width="54" height="105"/>
    <circle class="person" cx="135" cy="420" r="21"/><rect class="body" x="111" y="441" rx="14" width="48" height="96"/>
    <path d="M20 570 Q70 520 120 570" fill="none" stroke="#6c5a42" stroke-width="15"/>
    <text x="20" y="610" class="t sm">고양이 난입 →</text>
    <circle class="btn" cx="244" cy="631" r="42"/><text x="224" y="640" fill="white" class="t md">찰칵</text>
    <text x="92" y="770" class="t sm">3. 순간 선택</text>
  </g>

  <!-- Result -->
  <g transform="translate(1090 80)">
    <rect class="phone" x="0" y="0" rx="28" width="300" height="780"/>
    <rect class="stage" x="20" y="35" rx="8" width="260" height="350"/>
    <rect class="btn" x="70" y="50" rx="10" width="160" height="42"/>
    <text x="86" y="78" fill="white" class="t sm">전설의 가족사진</text>
    <text x="42" y="430" class="t lg">아빠는 꿈속,</text>
    <text x="42" y="466" class="t lg">동생은 공중</text>
    <rect class="card" x="25" y="500" rx="12" width="250" height="46"/><text x="44" y="530" class="t sm">구도 78 · 순간 93</text>
    <rect class="sub" x="25" y="557" rx="12" width="250" height="46"/><text x="44" y="587" class="t sm">사고 보너스 +430</text>
    <rect class="btn" x="35" y="645" rx="28" width="230" height="62"/>
    <text x="92" y="684" fill="white" class="t md">다음 사진</text>
    <text x="98" y="770" class="t sm">4. 웃긴 결과</text>
  </g>
</svg>
